[package]
name = "launcher"
version = "0.1.0"
description = "UltraTears Launcher - Desktop Frontend for Tears of the Kingdom Native Recomp"
authors = ["UltraTears Team"]
edition = "2021"

[lib]
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "process", "sync"] }
gilrs = "0.10"
directories = "5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
